<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Enable Clicky microphone</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f7f4; color: #171717; font: 15px/1.5 Inter, system-ui, sans-serif; }
      main { width: min(520px, calc(100vw - 48px)); padding: 36px; border: 1px solid #e5e1d8; border-radius: 22px; background: white; box-shadow: 0 24px 70px rgba(27,24,18,.1); }
      h1 { margin: 0 0 10px; font-size: 25px; }
      p { color: #625f58; }
      button { margin-top: 16px; border: 0; border-radius: 12px; padding: 12px 18px; background: #4f46e5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      #status { min-height: 24px; margin-top: 16px; color: #4f46e5; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Enable Clicky’s microphone</h1>
      <p>Chrome requires a one-time microphone permission for the extension. Audio is sent only while you hold Control.</p>
      <button id="enable" type="button">Enable microphone</button>
      <div id="status" role="status"></div>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
