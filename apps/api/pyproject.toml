[project]
name = "ctrlteach-backend"
version = "0.1.0"
description = "FastAPI backend for Ctrl+Teach"
requires-python = ">=3.12"
dependencies = [
    # OpenAI Agents SDK (Realtime layer) and OpenAI client
    "openai-agents",
    "openai",

    # Audio resampling for 16 kHz to 24 kHz PCM
    "numpy",

    # Database and settings
    "sqlalchemy>=2.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",

    # Authentication
    "passlib>=1.7.4",

    # Web framework
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.41.0",
    "websockets==15.0.1",

    # HTTP and networking
    "certifi>=2025.1.31",
    "httpx==0.28.1",
    "firecrawl-py==4.30.3",
    "python-multipart>=0.0.20",

    # Image processing
    "pillow==12.3.0",
]

[tool.uv]
package = false
